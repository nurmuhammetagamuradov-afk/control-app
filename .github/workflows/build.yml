name: Сборка приложения

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Установка зависимостей
        run: npm install
      - name: Создание Android-проекта
        run: |
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android
      - name: Разрешения и версия
        run: |
          MAN=android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />\n</manifest>#' $MAN
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]+\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          mkdir -p ~/.android && cp ci/debug.keystore ~/.android/debug.keystore
      - name: Сборка APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk Kontrol.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: Kontrol.apk

  ios:
    name: iPhone IPA
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Установка зависимостей
        run: npm install
      - name: Создание iOS-проекта
        run: |
          npx cap add ios
          npx capacitor-assets generate --ios
          npx cap sync ios
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" ios/App/App/Info.plist || true
      - name: Сборка без подписи
        run: |
          cd ios/App
          if [ -d App.xcworkspace ]; then SRC="-workspace App.xcworkspace"; else SRC="-project App.xcodeproj"; fi
          xcodebuild $SRC -scheme App -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qr ../../Kontrol.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: Kontrol.ipa

  release:
    name: Публикация
    needs: [android, ios]
    if: always() && (needs.android.result == 'success' || needs.ios.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Контроль 1.${{ github.run_number }}
          make_latest: true
          files: out/*
          body: |
            Android: скачай Kontrol.apk и установи.
            iPhone: Kontrol.ipa ставится через Sideloadly с компьютера.
